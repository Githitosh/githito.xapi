# githito.xapi: builds the day's API at 6:00, 12:00 and 18:00 (Japan) and publishes it on the branch "api".
# What it collects from is set in config.json ("source"). While that is "off", only the Humor page's stories are made
# (humor.mjs, config.json "humor").
name: Collect
on:
  schedule:
    - cron: '0 21 * * *'   # 6:00 in Japan
    - cron: '0 3 * * *'    # 12:00 in Japan
    - cron: '0 9 * * *'    # 18:00 in Japan
  workflow_dispatch:
    inputs:
      rejudge:
        description: 'Search nothing: only judge the saved data again by the rules as they are now'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: The API as it is now
        run: |
          mkdir -p public
          if git fetch --depth=1 origin api 2>/dev/null; then git archive FETCH_HEAD | tar -x -C public; fi
      - name: Collect
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          XAPI_NO_SEARCH: ${{ inputs.rejudge && '1' || '' }}
        run: node collect.mjs --out public
      # The Humor page's stories (loving exchanges; greetings in their hours), made ahead so the page only reads them.
      - name: Humor stories
        env:
          XAPI_NO_SEARCH: ${{ inputs.rejudge && '1' || '' }}
        run: node humor.mjs --out public
      - name: Publish (branch api, one commit, no history kept)
        run: |
          cd public
          if [ ! -f .changed ]; then echo "Nothing new to publish."; exit 0; fi
          rm -f .changed
          rm -rf .git
          git init -q -b api
          git config user.name "githito.xapi collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "API data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" api
