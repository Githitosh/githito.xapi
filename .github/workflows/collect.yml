# githito.xapi: collects by itself, for ever, one run every half hour, and publishes the result on the branch "api".
#
# One run: the Humor page's stories (humor.mjs) and their publishing, what people reply to the news and the
# headlines (news.mjs) and their publishing, then a wait until half an hour has passed since the run began, and
# the start of the next run (next.mjs). So the runs follow one another without anybody starting them and without
# a schedule: GitHub's own schedule starts runs hours late or not at all (runs set for the hour came five hours
# late). The schedule below is not what makes it run; it only starts the chain again if it should ever break.
#
# To stop it: set "loop": false in config.json (the run then ends without starting another), or disable the
# workflow in the Actions tab. "cycle" in config.json is the minutes from one run to the next.
name: Collect
# In the list of runs a run of the chain is named with a small graph of what the last 12 hours took in
# (stats.mjs makes it, next.mjs passes it on), so the list itself shows whether the collection goes well.
# repository_dispatch type "collect" mirrors workflow_dispatch inputs via client_payload
# (only, rejudge, searches, chain, note, bootstrap). Used when the Cursor app token
# can create repository_dispatch (204) but cannot workflow_dispatch (403).
run-name: ${{ github.event.client_payload.note || inputs.note || 'Collect' }}
on:
  schedule:
    - cron: '23 */3 * * *'   # only a safeguard: starts the chain again if it has stopped
  workflow_dispatch:
    inputs:
      rejudge:
        description: 'Search nothing: only judge the saved data again by the rules as they are now'
        type: boolean
        default: false
      only:
        description: 'Run one part only: news or humor (empty: everything)'
        type: string
        default: ''
      searches:
        description: 'News: how many reply searches this run makes (empty: as in config.json)'
        type: string
        default: ''
      chain:
        description: 'Start the next run when this one is done (the half-hour chain)'
        type: boolean
        default: false
      note:
        description: 'The name of the run in the list (the chain writes the intake of the last hours here)'
        type: string
        default: ''
      bootstrap:
        description: 'Humor: add ~500 romantic-reply accounts per language (long find; use once)'
        type: boolean
        default: false
  repository_dispatch:
    types: [collect]
permissions:
  contents: write
  actions: write
  issues: write
# One run at a time. A run that is waiting gives way to a newer one, so there is never more than one chain.
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Unify workflow_dispatch inputs and repository_dispatch client_payload.
      CHAIN: ${{ (github.event_name == 'schedule' || (github.event_name == 'repository_dispatch' && github.event.client_payload.chain) || (github.event_name != 'repository_dispatch' && inputs.chain)) && '1' || '' }}
      XAPI_ONLY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.only || inputs.only || '' }}
      XAPI_REJUDGE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.rejudge || github.event_name != 'repository_dispatch' && inputs.rejudge || false }}
      XAPI_SEARCHES: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.searches || inputs.searches || '' }}
      XAPI_BOOTSTRAP: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.bootstrap || github.event_name != 'repository_dispatch' && inputs.bootstrap || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: The API as it is now
        run: |
          echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p public
          if git fetch --depth=1 origin api 2>/dev/null; then git archive FETCH_HEAD | tar -x -C public; fi
      # News accounts (news-famous.json) and humor accounts (humor-accounts.json) both live only in the
      # PRIVATE memo (githito.memo). Algorithms stay in this public repo. Account names are never
      # published to the api branch, README, or logs. No built-in paper/broadcaster list is used.
      - name: The memo (a private repository)
        continue-on-error: true
        env:
          MEMO_TOKEN: ${{ secrets.MEMO_TOKEN }}
          MEMO_REPO: ${{ vars.MEMO_REPO || format('{0}/githito.memo', github.repository_owner) }}
        run: |
          if [ -z "$MEMO_TOKEN" ]; then
            echo "No MEMO_TOKEN: private memo not read; no news or humor accounts this run."
            echo "### 記録（非公開リポジトリ）" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ MEMO_TOKEN が無いため、非公開メモのアカウント一覧を読めません。ニュースもユーモアもこの実行では集めません。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git clone -q --depth=1 "https://x-access-token:${MEMO_TOKEN}@github.com/${MEMO_REPO}.git" "$RUNNER_TEMP/memo"; then
            git -C "$RUNNER_TEMP/memo" remote set-url origin "https://github.com/${MEMO_REPO}.git"
            echo "XAPI_MEMO_DIR=$RUNNER_TEMP/memo" >> "$GITHUB_ENV"
            if [ -f "$RUNNER_TEMP/memo/news-famous.json" ]; then
              echo "News accounts: private memo only (handles not printed)."
            else
              echo "News accounts: private memo has no news-famous.json (no news accounts this run)."
            fi
            if [ -f "$RUNNER_TEMP/memo/humor-accounts.json" ]; then
              echo "Humor accounts: private memo only."
            else
              echo "Humor accounts: private memo has no humor-accounts.json yet (humor-find will create it)."
            fi
            echo "The private repository is read."
          else
            echo "Private memo could not be read: no news or humor accounts this run."
            echo "### 記録（非公開リポジトリ）" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ 非公開リポジトリ ${MEMO_REPO} を読めませんでした。ニュースもユーモアもこの実行では集めません。MEMO_TOKEN を確認してください。" >> "$GITHUB_STEP_SUMMARY"
          fi
      # Requests the owner sent as issues ("account": the accounts whose replies the News page may play,
      # saved only in the private memo; "talk"): read first, so that this run already collects for them.
      # The Ingest workflow does the same when the issue is opened, but it may have given way to a run of this chain.
      - name: Requests sent as issues
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ingest.mjs --out public
      # The earlier collection for Reply News (collect.mjs). It is switched off in config.json ("source": "off")
      # and runs only when a person starts a whole run by hand.
      - name: Collect
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && env.XAPI_ONLY == '' && env.CHAIN != '1' }}
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          XAPI_NO_SEARCH: ${{ env.XAPI_REJUDGE == 'true' && '1' || '' }}
        run: node collect.mjs --out public
      # Humor: first record ~50 new clearly-romantic-reply accounts into humor-accounts.json (humor-find.mjs),
      # then read only those registered accounts' timelines/conversations (humor.mjs) for ~160 stories.
      # Stock is text-only (no handles); ordinary replies are pruned on every run.
      # The memo was read above. It needs two things set once by the owner: a private repository named
      # githito.memo (or the name in the repository variable MEMO_REPO, "owner/name"), and the secret
      # MEMO_TOKEN, a fine-grained token that may read and write that repository's contents. Without the
      # secret nothing is remembered and an account list is not saved.
      - name: Humor accounts (about 50 new each run; or ~800/lang when bootstrap; aim ~2000 total)
        if: ${{ env.XAPI_ONLY == '' || env.XAPI_ONLY == 'humor' }}
        continue-on-error: true
        env:
          XAPI_NO_SEARCH: ${{ env.XAPI_REJUDGE == 'true' && '1' || '' }}
        run: node humor-find.mjs ${{ env.XAPI_BOOTSTRAP == 'true' && '--bootstrap' || '' }}
      - name: Humor stories
        if: ${{ env.XAPI_ONLY == '' || env.XAPI_ONLY == 'humor' }}
        continue-on-error: true
        env:
          XAPI_NO_SEARCH: ${{ env.XAPI_REJUDGE == 'true' && '1' || '' }}
        run: node humor.mjs --out public ${{ env.XAPI_BOOTSTRAP == 'true' && '--minutes 28' || '' }}
      - name: Save the memo (the private repository)
        if: ${{ env.XAPI_MEMO_DIR != '' }}
        continue-on-error: true
        env:
          MEMO_TOKEN: ${{ secrets.MEMO_TOKEN }}
          MEMO_REPO: ${{ vars.MEMO_REPO || format('{0}/githito.memo', github.repository_owner) }}
        run: |
          cd "$XAPI_MEMO_DIR"
          git config user.name "githito.xapi collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "The memo did not change."; exit 0; fi
          git commit -q -m "Memo $(date -u +%Y-%m-%dT%H:%MZ)"
          echo "### 記録（非公開リポジトリ）" >> "$GITHUB_STEP_SUMMARY"
          if git push -q "https://x-access-token:${MEMO_TOKEN}@github.com/${MEMO_REPO}.git" HEAD:main; then
            echo "The memo is saved in the private repository."
            echo "✅ アカウントの記録を非公開リポジトリ ${MEMO_REPO} に保存しました。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The memo could not be saved in the private repository."
            echo "⚠️ 非公開リポジトリ ${MEMO_REPO} に保存できませんでした。MEMO_TOKEN に Contents の「Read and write」権限があるか確かめてください。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish the humor stories
        if: ${{ env.XAPI_ONLY == '' || env.XAPI_ONLY == 'humor' }}
        run: |
          cd public
          # Account lists are private. Never publish them, even if an older run left a file here.
          if [ -f v1/accounts.json ] || [ -f v1/news-famous.json ] || [ -f v1/humor-accounts.json ] || compgen -G 'v1/humor-memo-*.json' >/dev/null; then rm -f v1/accounts.json v1/news-famous.json v1/humor-accounts.json v1/humor-memo-*.json; touch .changed; fi
          if [ ! -f .changed ]; then echo "Nothing new to publish."; exit 0; fi
          rm -f .changed
          rm -rf .git
          git init -q -b api
          git config user.name "githito.xapi collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "API data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" api
          rm -rf .git
      # Replies to accounts the owner sent (news.mjs). News accounts are not chosen here.
      - name: Replies to the news
        if: ${{ env.XAPI_ONLY == '' || env.XAPI_ONLY == 'news' }}
        continue-on-error: true
        env:
          XAPI_NO_SEARCH: ${{ env.XAPI_REJUDGE == 'true' && '1' || '' }}
        run: node news.mjs --out public ${{ env.XAPI_SEARCHES != '' && format('--searches {0}', env.XAPI_SEARCHES) || '' }}
      # News posts (people.mjs): private memo news-famous.json only. ~5 clips/account, stock toward ~2000.
      # When that file is missing, no news account is read. Names are not printed in logs.
      - name: News posts from registered accounts
        if: ${{ env.XAPI_ONLY == '' || env.XAPI_ONLY == 'news' }}
        continue-on-error: true
        run: node people.mjs --out public

      # English headlines already collected: kept only when the account is in that same file.
      - name: English news
        if: ${{ env.XAPI_ONLY == '' || env.XAPI_ONLY == 'news' }}
        continue-on-error: true
        run: node english.mjs --out public
      # news-read.json (who was read) is written by people.mjs into the memo. Save it here, after that
      # write. Names are not printed. The humor memo was saved above; this push includes both.
      - name: Save the memo again (news)
        if: ${{ env.XAPI_MEMO_DIR != '' }}
        continue-on-error: true
        env:
          MEMO_TOKEN: ${{ secrets.MEMO_TOKEN }}
          MEMO_REPO: ${{ vars.MEMO_REPO || format('{0}/githito.memo', github.repository_owner) }}
        run: |
          cd "$XAPI_MEMO_DIR"
          git config user.name "githito.xapi collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "The memo did not change."; exit 0; fi
          git commit -q -m "Memo $(date -u +%Y-%m-%dT%H:%MZ)"
          if git push -q "https://x-access-token:${MEMO_TOKEN}@github.com/${MEMO_REPO}.git" HEAD:main; then
            echo "The memo is saved in the private repository."
          else
            echo "The memo could not be saved in the private repository."
          fi
      # The video stock (stock.mjs). News cards whose accounts are not in the private memo are dropped
      # here and are not refilled. Humor stock stays. Memo cards keep accumulating.
      - name: Cards and the video stock
        if: ${{ always() }}
        continue-on-error: true
        run: node stock.mjs --out public
      # How much each hour took in (stats.mjs): v1/stats.json and the graph v1/intake.svg (the README shows it),
      # and on this run's own page the graph, this run's numbers and a table with a bar for each hour.
      - name: Intake graph
        if: ${{ always() }}
        continue-on-error: true
        run: node stats.mjs --out public
      - name: Publish (branch api, one commit, no history kept)
        run: |
          cd public
          # Account lists are private. Never publish them, even if an older run left a file here.
          if [ -f v1/accounts.json ] || [ -f v1/news-famous.json ] || [ -f v1/humor-accounts.json ] || compgen -G 'v1/humor-memo-*.json' >/dev/null; then rm -f v1/accounts.json v1/news-famous.json v1/humor-accounts.json v1/humor-memo-*.json; touch .changed; fi
          if [ ! -f .changed ]; then echo "Nothing new to publish."; exit 0; fi
          rm -f .changed
          rm -rf .git
          git init -q -b api
          git config user.name "githito.xapi collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "API data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" api
      # The chain (next.mjs): a run waits until half an hour has passed since it began and starts the next run;
      # a run started by hand starts the next one at once.
      - name: Start the next run
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node next.mjs
