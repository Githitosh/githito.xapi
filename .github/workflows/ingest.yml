# githito.xapi: adds a talk that the owner sent by hand, or sets the accounts whose replies the News page may play.
# An issue titled "talk" holds the links: the first is the post, the ones after it are replies.
# Each link is read through X's official embed API (no key, no charge). Only the owner's issues are read.
# An issue titled "account" lists X accounts, one on each line; it replaces the list in v1/accounts.json.
name: Ingest
on:
  issues:
    types: [opened]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  ingest:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: The API as it is now
        run: |
          mkdir -p public
          if git fetch --depth=1 origin api 2>/dev/null; then git archive FETCH_HEAD | tar -x -C public; fi
      - name: Read the links and add the talks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ingest.mjs --out public
      - name: Publish (branch api, one commit, no history kept)
        run: |
          cd public
          if [ ! -f .changed ]; then echo "Nothing new to publish."; exit 0; fi
          rm -f .changed
          rm -rf .git
          git init -q -b api
          git config user.name "githito.xapi collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "API data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" api
